<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Álbum da Memória</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap">

<style>
  /* ============ PALETAS ============ */

  /* A · carta antiga — papel rosado, tinta vinho, dourado velho */
  :root, :root[data-paleta="carta"]{
    --fundo:#D3ABA5;
    --album-1:#F7EBE5;
    --album-2:#EEDBD3;
    --album-borda:rgba(122,47,66,.16);
    --costura:#C99A94;
    --verso-1:#C98A8E;
    --verso-2:#B0727A;
    --verso-marca:rgba(255,248,244,.55);
    --tinta:#7A2F42;
    --tinta-clara:#9C4155;
    --dourado:#B98E4E;
    --texto:#6E4B48;
    --texto-fraco:#A07E79;
    --foto-papel:#FFFCF8;
    --bilhete:#FFF7F1;
    --bilhete-texto:#4A2C31;
    --sombra:rgba(90,40,45,.30);
  }

  /* B · veludo — caixa de joia, fundo vinho, dourado */
  :root[data-paleta="veludo"]{
    --fundo:#1C0A11;
    --album-1:#4A2029;
    --album-2:#33151D;
    --album-borda:rgba(0,0,0,.5);
    --costura:#8A5560;
    --verso-1:#5E2934;
    --verso-2:#3F1B24;
    --verso-marca:rgba(232,196,180,.42);
    --tinta:#EBC5BB;
    --tinta-clara:#F2D6CC;
    --dourado:#D3A961;
    --texto:#DCBEB4;
    --texto-fraco:#A88A83;
    --foto-papel:#F7ECE4;
    --bilhete:#F7ECE4;
    --bilhete-texto:#431D26;
    --sombra:rgba(0,0,0,.55);
  }

  /* C · amanhecer — pêssego, tinta ameixa */
  :root[data-paleta="amanhecer"]{
    --fundo:#E3BC98;
    --album-1:#FCF0E1;
    --album-2:#F4E0C9;
    --album-borda:rgba(107,53,80,.15);
    --costura:#D6B08C;
    --verso-1:#E3A98A;
    --verso-2:#CB8A6D;
    --verso-marca:rgba(255,250,244,.6);
    --tinta:#6B3550;
    --tinta-clara:#8D4869;
    --dourado:#B8804A;
    --texto:#7A5340;
    --texto-fraco:#AC8A73;
    --foto-papel:#FFFCF6;
    --bilhete:#FFFAF2;
    --bilhete-texto:#4C2E3E;
    --sombra:rgba(120,70,45,.30);
  }

  *{box-sizing:border-box}

  body{
    margin:0;
    background:var(--fundo);
    color:var(--texto);
    font-family:"Courier Prime","Courier New",monospace;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:22px 14px 52px;
  }

  .album{
    width:100%;
    max-width:540px;
    background:
      repeating-linear-gradient(93deg, rgba(255,255,255,.10) 0 2px, transparent 2px 5px),
      repeating-linear-gradient(3deg, rgba(0,0,0,.022) 0 3px, transparent 3px 8px),
      linear-gradient(165deg, var(--album-1), var(--album-2));
    border:1px solid var(--album-borda);
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset, 0 22px 54px var(--sombra);
    padding:26px 20px 32px;
    position:relative;
  }
  /* costura da lombada */
  .album::before{
    content:"";
    position:absolute; left:9px; top:16px; bottom:16px; width:1px;
    background:repeating-linear-gradient(var(--costura) 0 7px, transparent 7px 15px);
    opacity:.75;
  }

  .aviso{
    font-size:11px; line-height:1.55; color:var(--texto-fraco);
    border:1px dashed var(--costura);
    padding:9px 11px; margin:0 0 20px;
  }
  .aviso b{color:var(--tinta); font-weight:700}
  .paletas{display:flex; gap:7px; margin-top:9px; flex-wrap:wrap}
  .paletas button{
    font-size:10px; letter-spacing:.12em; padding:5px 9px;
    border:1px solid var(--costura); color:var(--texto-fraco); background:none;
  }
  .paletas button:hover{background:none; color:var(--tinta)}
  .paletas button[aria-pressed="true"]{
    border-color:var(--dourado); color:var(--dourado);
  }

  /* ---------- capa / fecho ---------- */
  .capa{text-align:center; padding:24px 4px 10px}
  .capa h1{
    font-family:"Caveat",cursive;
    font-size:clamp(46px,14vw,72px);
    font-weight:700; color:var(--tinta);
    margin:0; line-height:.95; text-wrap:balance;
    transform:rotate(-1.6deg);
  }
  .selo{
    font-size:10.5px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--texto-fraco); margin:18px 0 32px;
  }
  @media (max-width:420px){
    .selo{font-size:9px; letter-spacing:.14em}
  }
  .pergunta{
    font-family:"Caveat",cursive; font-size:clamp(21px,6.2vw,27px); color:var(--tinta-clara);
    line-height:1.25; margin:0 auto 20px; max-width:30ch; text-wrap:balance;
  }
  .fecho{display:flex; flex-direction:column; align-items:center; gap:13px}
  input[type=text]{
    font-family:"Courier Prime",monospace; font-size:16px;
    width:min(240px,80%); text-align:center;
    background:var(--foto-papel); color:var(--bilhete-texto);
    border:none; border-bottom:2px solid var(--dourado);
    padding:11px 10px; letter-spacing:.06em;
  }
  input[type=text]:focus{outline:2px solid var(--tinta-clara); outline-offset:2px}

  button{
    font-family:"Courier Prime",monospace; font-size:12px;
    letter-spacing:.18em; text-transform:uppercase;
    background:transparent; color:var(--tinta);
    border:1px solid var(--tinta); padding:11px 22px;
    cursor:pointer; transition:background .2s, color .2s;
  }
  button:hover{background:var(--tinta); color:var(--foto-papel)}
  button:focus-visible{outline:2px solid var(--dourado); outline-offset:3px}

  .erro{font-size:12px; color:var(--tinta-clara); min-height:1.2em; margin:0}
  .pular{
    background:none; border:none; color:var(--texto-fraco);
    font-size:11px; text-transform:none; letter-spacing:0;
    text-decoration:underline; padding:4px; cursor:pointer;
  }
  .pular:hover{background:none; color:var(--tinta)}
  [hidden]{display:none !important}

  /* ---------- tabuleiro ---------- */
  .barra{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:10.5px; letter-spacing:.2em; text-transform:uppercase;
    color:var(--texto-fraco); border-bottom:1px solid var(--costura);
    padding-bottom:9px; margin-bottom:18px;
  }
  .barra strong{color:var(--tinta); font-weight:700}

  .grade{display:grid; grid-template-columns:repeat(3,1fr); gap:11px}
  @media (min-width:470px){ .grade{grid-template-columns:repeat(4,1fr); gap:13px} }

  .carta{
    position:relative; aspect-ratio:3/4; perspective:900px;
    background:none; border:none; padding:0; cursor:pointer;
  }
  .carta:hover{background:none}
  .carta:focus-visible{outline:2px solid var(--tinta); outline-offset:3px}
  .miolo{
    position:absolute; inset:0; transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.3,.8,.4,1);
  }
  .carta[data-virada="sim"] .miolo{transform:rotateY(180deg)}
  .face{position:absolute; inset:0; backface-visibility:hidden; overflow:hidden}

  /* verso da carta */
  .verso{
    background:linear-gradient(150deg,var(--verso-1),var(--verso-2));
    box-shadow:0 3px 9px var(--sombra);
    display:grid; place-items:center;
  }
  .verso span{
    font-family:"Caveat",cursive; font-size:34px; line-height:1;
    color:var(--verso-marca); transform:rotate(-7deg);
  }
  .verso::after{
    content:""; position:absolute; inset:5px;
    border:1px solid var(--verso-marca); opacity:.4;
  }

  /* frente: a foto */
  .frente{transform:rotateY(180deg); background:var(--foto-papel); padding:4px}
  .foto{width:100%; height:100%; object-fit:cover; display:block}
  .foto.inteira{object-fit:contain}
  .foto-vazia{
    width:100%; height:100%; display:grid; place-items:center;
    font-family:"Caveat",cursive; font-size:19px; color:rgba(74,44,49,.45);
    background:linear-gradient(155deg,var(--t1),var(--t2));
  }
  /* cantoneira dourada nas fotos já formadas */
  .carta[data-par="sim"] .frente::before,
  .carta[data-par="sim"] .frente::after{
    content:""; position:absolute; width:15px; height:15px;
    background:linear-gradient(135deg,var(--dourado),#8C6B36);
  }
  .carta[data-par="sim"] .frente::before{top:0; left:0; clip-path:polygon(0 0,100% 0,0 100%)}
  .carta[data-par="sim"] .frente::after{bottom:0; right:0; clip-path:polygon(100% 100%,100% 0,0 100%)}
  .carta[data-par="sim"]{cursor:default}
  .carta[data-par="sim"] .miolo{
    box-shadow:0 7px 18px var(--sombra);
    transform:rotateY(180deg) rotate(.9deg);
  }

  /* ---------- legendas ---------- */
  .legendas{
    margin-top:26px; padding-top:16px;
    border-top:1px solid var(--costura);
    display:flex; flex-direction:column; gap:14px; min-height:56px;
  }
  .dica{font-size:11px; color:var(--texto-fraco); letter-spacing:.1em; text-transform:uppercase; margin:0}
  .legenda{
    font-family:"Caveat",cursive; font-size:24px; line-height:1.3;
    color:var(--tinta); margin:0; padding-left:15px;
    border-left:2px solid var(--dourado);
    animation:entra .45s ease-out both;
  }
  .legenda:nth-child(even){transform:rotate(-.5deg)}
  @keyframes entra{from{opacity:0; transform:translateY(7px)} to{opacity:1}}

  /* ---------- última página: o instrumento ---------- */
  .contrato{
    background:var(--bilhete); color:var(--bilhete-texto);
    padding:34px 26px 30px;
    box-shadow:0 16px 40px var(--sombra);
    position:relative; overflow:hidden;
    font-size:12.5px; line-height:1.8;
    animation:entra .7s ease-out both;
  }
  .contrato h2{
    font-size:14px; font-weight:700; line-height:1.4;
    letter-spacing:.14em; text-align:center; text-transform:uppercase;
    margin:0 0 6px; color:var(--tinta);
  }
  .contrato .sub{
    text-align:center; font-size:10.5px; letter-spacing:.1em;
    color:var(--texto-fraco); margin:0 0 4px;
  }
  .contrato .registro{
    text-align:center; font-size:9.5px; letter-spacing:.2em;
    text-transform:uppercase; color:var(--texto-fraco);
    margin:0 0 24px; padding-bottom:16px;
    border-bottom:1px solid var(--costura);
  }
  .contrato .preambulo{margin:0 0 22px; text-align:justify}
  .contrato .clausula{margin:0 0 18px}
  .contrato .clausula h3{
    font-size:11px; font-weight:700; letter-spacing:.11em;
    text-transform:uppercase; color:var(--tinta);
    margin:0 0 3px;
  }
  .contrato .clausula p{margin:0; text-align:justify}
  .contrato .encerramento{
    margin:24px 0 0; text-align:justify;
    padding-top:16px; border-top:1px solid var(--costura);
  }
  .contrato .data{margin:20px 0 0; text-align:center; font-size:11.5px}
  .assina{margin:34px auto 0; max-width:280px; text-align:center}
  .assina .manuscrita{
    font-family:"Caveat",cursive; font-size:38px; line-height:.9;
    color:var(--tinta); transform:rotate(-3deg);
    margin:0 0 2px; padding-bottom:6px;
  }
  .assina .linha{border-top:1px solid var(--bilhete-texto); margin:0 0 7px}
  .assina .nome{
    margin:0; font-size:11px; letter-spacing:.12em; text-transform:uppercase;
  }
  .assina .papel{margin:3px 0 0; font-size:10.5px; color:var(--texto-fraco)}
  .carimbo{
    position:absolute; right:14px; bottom:16px;
    border:2px solid var(--tinta); color:var(--tinta);
    padding:7px 11px; transform:rotate(-11deg);
    font-size:9px; letter-spacing:.16em; text-transform:uppercase;
    line-height:1.5; text-align:center; opacity:.30; pointer-events:none;
  }
  @media (max-width:560px){
    .contrato .preambulo,
    .contrato .clausula p,
    .contrato .encerramento{text-align:left}
  }
  @media (max-width:420px){
    .contrato{padding:26px 18px 24px; font-size:12px; line-height:1.7}
    .carimbo{display:none}
  }
  .denovo{display:block; margin:26px auto 0}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important; transition-duration:.01ms !important}
  }
</style>

      <p class="dica">ache um par e a legenda aparece aqui</p>
    </div>
  </section>

  <!-- final -->
  <section id="final" hidden></section>
</div>

const TINTAS = [
  ["#F2D9CE","#DDB9AC"], ["#EFD3D3","#D5AAAE"], ["#F4DFC9","#DCBB99"],
  ["#E8D5DA","#C7A7B3"], ["#F1DCC6","#D3B192"], ["#EAD6D0","#C9A9A4"]
];

const $ = id => document.getElementById(id);
const limpa = s => s.trim().toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");

document.documentElement.dataset.paleta = PALETA;

/* --- fecho --- */
let erros = 0;
$("pergunta").textContent = SEGREDO.pergunta;

$("fecho").addEventListener("submit", e => {
  e.preventDefault();
  const dito = limpa($("chave").value);
  if (SEGREDO.respostas.some(r => limpa(r) === dito)) return abrir();
  erros++;
  $("erro").textContent = erros === 1
    ? (SEGREDO.dica || "quase. pensa de novo.")
    : "não é essa. juro que é fácil.";
  if (erros >= 2) $("pular").hidden = false;
  $("chave").select();
});
$("pular").addEventListener("click", abrir);

function abrir(){
  $("capa").hidden = true;
  $("jogo").hidden = false;
  $("grade").querySelector("button")?.focus();
}

/* --- tabuleiro --- */
let primeira = null, travado = false, achados = 0, tentativas = 0;

const baralho = MOMENTOS.flatMap((m,i) => [{...m,i},{...m,i}])
  .map(c => ({c, o:Math.random()})).sort((a,b) => a.o-b.o).map(x => x.c);

baralho.forEach((m, pos) => {
  const [t1,t2] = TINTAS[m.i % TINTAS.length];
  const b = document.createElement("button");
  b.className = "carta";
  b.dataset.id = m.i;
  b.setAttribute("aria-label", "carta " + (pos+1));
  const frente = FOTOS[m.foto]
    ? `<img class="foto${m.inteira ? " inteira" : ""}" src="${FOTOS[m.foto]}" alt="">`
    : `<div class="foto-vazia" style="--t1:${t1};--t2:${t2}">foto ${m.i+1}</div>`;
  b.innerHTML = `<span class="miolo">
      <span class="face verso"><span>?</span></span>
      <span class="face frente">${frente}</span>
    </span>`;
  b.addEventListener("click", () => vira(b));
  $("grade").appendChild(b);
});

function vira(carta){
  if (travado || carta.dataset.virada === "sim" || carta.dataset.par === "sim") return;
  carta.dataset.virada = "sim";

  if (!primeira){ primeira = carta; return; }

  tentativas++;
  $("tentativas").textContent = tentativas;

  if (primeira.dataset.id === carta.dataset.id){
    primeira.dataset.par = carta.dataset.par = "sim";
    primeira = null;
    achados++;
    $("placar").textContent = achados + "/" + MOMENTOS.length;
    mostraLegenda(MOMENTOS[carta.dataset.id].legenda);
    if (achados === MOMENTOS.length) setTimeout(fecha, 1100);
  } else {
    travado = true;
    const a = primeira, b = carta;
    primeira = null;
    setTimeout(() => { a.dataset.virada = b.dataset.virada = "nao"; travado = false; }, 850);
  }
}

function mostraLegenda(texto){
  const cx = $("legendas");
  cx.querySelector(".dica")?.remove();
  const p = document.createElement("p");
  p.className = "legenda";
  p.textContent = texto;
  cx.appendChild(p);
}

function fecha(){
  $("jogo").hidden = true;
  const f = $("final");
  f.hidden = false;
  f.innerHTML = `<div class="contrato">
      <h2>${CONTRATO.titulo}</h2>
      <p class="sub">${CONTRATO.subtitulo}</p>
      <p class="registro">${CONTRATO.registro}</p>
      <p class="preambulo">${CONTRATO.preambulo}</p>
      ${CONTRATO.clausulas.map(k => `<div class="clausula">
        <h3>${k.t}</h3><p>${k.c}</p></div>`).join("")}
      <p class="encerramento">${CONTRATO.encerramento}</p>
      <p class="data">${CONTRATO.data}</p>
      <div class="assina">
        <p class="manuscrita">${CONTRATO.assinatura}</p>
        <div class="linha"></div>
        <p class="nome">${CONTRATO.assinatura}</p>
        <p class="papel">${CONTRATO.papel}</p>
      </div>
      <div class="carimbo">${CONTRATO.carimbo.join("<br>")}</div>
    </div>
    <button class="denovo" onclick="location.reload()">jogar de novo</button>`;
  f.scrollIntoView({behavior:"smooth", block:"start"});
}
</script>
